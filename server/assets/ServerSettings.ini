;|======================================================================================================|
;| Wardogs Dedicated Server Standalone Config                                                           |      
;|                                                                                                      |                                         
;| Only the keys below are honored. The server's allow-list (AllowedConfigs in                          |
;| DedicatedServerEngine.ini) strips any section or key that is not whitelisted,                        |
;| so adding extra keys here does nothing. Settings apply at server startup.                            |
;|                                                                                                      |
;| Lines you do not want to set can be deleted or commented via ";" -- omitted keys keep their default. |
;|======================================================================================================|


[/Script/WDGame.WDGameSession]
; Display name shown in the server browser.
ServerName=Wardogs Demo Server

; Join password. Leave empty for an open server.
ServerPassword=

; Player cash bounds. 0 = no restriction.
ServerMinPlayerCash=0
ServerMaxPlayerCash=0

; Player level bounds. 0 = no restriction.
ServerMinPlayerLevel=0
ServerMaxPlayerLevel=0

; Sponsor banner image URL. Must be 1024x256 PNG/JPEG and on the server's image allow-list.
ServerImageURL=https://i.postimg.cc/5N5ynGcY/Server-Browser-Image.jpg

; Reserved slots: max count, then one '+DefaultReservedPlayerIds=' line per SteamID64.
; The RCON 'reserved add/remove' commands edit these and persist back here.
MaxReservedSlots=20
+DefaultReservedPlayerIds="76561198000000001"
; +DefaultReservedPlayerIds="76561198000000002"

; Banned players: one '+DefaultBannedPlayerIds=' line per SteamID64.
; The RCON ban/unban commands edit these and persist back here.
+DefaultBannedPlayerIds="76561198000000003"
; +DefaultBannedPlayerIds="76561198000000004"


[/Script/Engine.GameSession]

; Maximum players. Clamped by the developer-set Lowest/HighestAllowedMaxPlayers.
MaxPlayers=32


[MatchState.PreMatch.WaitingForPlayers.PlayerCount]

; Players required to move from pre-match into the match.
MinimumRequiredPlayers=60


[MatchState.Playing.KOTH]

; KOTH score tick period in seconds. Clamped by the developer-set Min/MaxScorePeriod.
ScorePeriod=24


[/Script/WDGame.WDGameStateSession]

; Team balancing: lock joining an overpopulated team once it leads by the threshold.
bLockOverpopulatedTeamsConfig=true
OverpopulatedTeamThresholdConfig=2


[/Script/WDGame.WDServerMapRotationSettings]

; Turn the rotation on and pick the order mode (Ordered or Random).
bEnabled=true
RotationMode=Ordered

; One entry per line. Experience (singular) = one experience; Experiences (plural) = several
; joined with '+'. Lighting is an allowed lighting scenario. ZoneAlternator is optional -- omit
; it to keep the map's authored default control-zone alternator.
+RotationEntries=(Map="Kavkazi",Experience="Bakurani_KOTH_01",Lighting="DayClear",ZoneAlternator="ZoneAlternator.Factory.Circle")
+RotationEntries=(Map="Europe",Experiences="Madrid_KOTH_01+KOTH_InfantryOnly",Lighting="DayLateGray")
+RotationEntries=(Map="Europe",Experiences="Madrid_KOTH_01",Lighting="DayLateClear")


[/Script/WDRCON.WDRCONSettings]

; Enable the RCON admin listener. Off by default.
bEnabled=true

; Listener bind address. 127.0.0.1 = loopback (allows plaintext Password); 0.0.0.0 = all interfaces (needs TLS + PasswordHash).
BindAddress=127.0.0.1

; RCON admin port. Default 7776, customizable through this or the "-RCONPort=" launch argument.
Port=1031

; Set a plaintext RCON password to control the server from the RCON admin tool. If left empty
; the server auto-generates one each boot and writes it to Saved/RCON/ADMIN-PASSWORD.txt.
; A non-loopback server still needs a TLS cert + key configured to start the RCON listener.
Password=

; Alternative to plaintext: a pre-hashed password from 'WardogsServer -GenerateRCONHash=<pw>'.
; PasswordHash takes precedence over Password when both are set.
PasswordHash=""

; ── Event feed ──────────────────────────────────────────────────────────────────────────────────────
; Moved here from WDServerFeed in 0.2. Requires bEnabled above: RCON off means feed off. Read once at
; startup, so changes need a server restart.
;
; Up to 4 endpoints. Each receives every event, and one that is down never delays the others.
; Url is POSTed to exactly as written. Token, if set, is sent as "Authorization: Bearer <Token>".
; Use https:// -- each event names the players involved and carries their Steam ids.
;
; These can only be set in this file, never over RCON, and GET /v1/config shows the endpoints as
; [redacted]. GET /v1/feed reports whether each endpoint is receiving.
bEventFeedEnabled=false
;+EventFeedEndpoints=(Url="https://example.com/hooks/wardogs",Token="your-secret")
;+EventFeedEndpoints=(Url="https://stats.example.org/ingest")

; Optional label sent with every batch. Left empty, none is sent.
;EventFeedServerName="My Server"


[/Script/HighPingKickRuntime.WDHighPingKickSettings]

; Average ping limit in milliseconds, checked about two minutes after every join (map changes included).
; 0 = off (default); 1100 or more never kicks. A patch from your hosting provider overrides every value in this section.
MaxAveragePingMilliseconds=0

; Refuse a kicked player's logins until the server changes map.
bSoftBanKickedPlayers=True

; Seconds ignored after every login.
WarmupSeconds=15

; Seconds without a packet from a joining player that count as a stall and restart their warmup.
StallSeconds=0.5

; Longest warmup after a login, however often stalls restart it.
MaximumWarmupSeconds=60

; Seconds of samples before the decision.
MeasurementSeconds=120

; Seconds between samples, never below MinimumSampleIntervalSeconds.
SampleIntervalSeconds=5

; Lowest allowed SampleIntervalSeconds.
MinimumSampleIntervalSeconds=5

; Server time lost to very long server frames since the last sample pass, above which that pass takes no samples.
ServerHitchSeconds=0.1
