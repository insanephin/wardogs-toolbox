x-app: &app
  image: node:22.13-bookworm-slim
  working_dir: /app
  user: "1001:1001"
  volumes:
    - ./:/app
  restart: unless-stopped

services:
  web:
    <<: *app
    command: ["node", "--watch", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "server/main.ts"]
    env_file:
      - path: .env
        required: true
    environment:
      COOKIE_SECURE: "true"
      DB_PATH: /app/data/dashboard.db
    ports:
      - "127.0.0.1:8087:8080"
    networks:
      - app
      - dbs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    image: python:3.11
    restart: unless-stopped
    volumes:
      - ./bot:/app
    working_dir: /app
    depends_on:
      - web
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    networks:
      - app
    command: [
      "sh", "-c",
      "pip install --upgrade pip && pip install -r requirements.txt && python main.py"
    ]

networks:
  app:
    driver: bridge
  dbs:
    external: true