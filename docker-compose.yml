x-app: &app
  image: node:22.13-bookworm-slim
  working_dir: /app
  user: "${DOCKER_USER:-1000:1000}"
  volumes:
    - ./:/app
  restart: unless-stopped

services:
  dashboard:
    <<: *app
    command: ["node", "--watch", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "server/main.ts"]
    env_file:
      - path: .env
        required: true
    environment:
      DASH_HOST: 0.0.0.0
      DASH_PORT: 8080
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      DB_PATH: /app/data/dashboard.db
    networks:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN:?Set CLOUDFLARED_TOKEN in .env}"]
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge

