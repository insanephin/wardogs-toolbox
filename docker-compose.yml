x-app: &app
  image: node:22.13-bookworm-slim
  working_dir: /app
  user: "${DOCKER_USER:-1000:1000}"
  volumes:
    - ./:/app
  restart: unless-stopped

services:
  dashboard:
    <<: *app
    command: ["node", "--watch", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "server/main.ts"]
    env_file:
      - path: .env
        required: true
    environment:
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      DB_PATH: /app/data/dashboard.db
    ports:
      - "8087:8080"
    networks:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    image: python:3.11
    restart: unless-stopped
    volumes:
      - ./bot:/app
    working_dir: /app
    depends_on:
      - dashboard
    networks:
      - app
    command: [
      "sh", "-c",
      "pip install --upgrade pip && pip install -r requirements.txt && python main.py"
    ]

networks:
  app:
    driver: bridge
